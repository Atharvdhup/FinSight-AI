spring:
  application:
    name: gateway-service-test
  cloud:
    gateway:
      routes:
        - id: portfolio-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/portfolios/**
        - id: market-data-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/market/**
        - id: alert-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/alerts/**
        - id: research-service-route
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/research/**

finsight:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

