server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: portfolio-service-route
          uri: ${PORTFOLIO_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/portfolios/**
        - id: market-data-service-route
          uri: ${MARKET_DATA_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/market/**
        - id: research-service-route
          uri: ${RESEARCH_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/research/**
        - id: alert-service-route
          uri: ${ALERT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/alerts/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
